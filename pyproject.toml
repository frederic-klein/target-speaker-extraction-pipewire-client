[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tse-pipewire"
version = "0.1.0"
description = "Target Speaker Extraction as PipeWire Client - Real-time voice isolation for Linux"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.17.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "click>=8.1.0",
    "toml>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
tse-pipewire = "tse_pipewire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
